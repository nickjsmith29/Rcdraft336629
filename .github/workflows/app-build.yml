name: App build (unsigned)

# Compiles the iPhone app and the Apple Watch app for the simulator so screens
# and Watch code are checked before the Apple developer account exists.
# It does not sign, run on a device, or upload anything (that is ios.yml).
# Free on this public repo; it runs only on ready (non-draft) pull requests
# that touch the app, project.yml or CoachCore sources, or by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "App/**"
      - "WatchApp/**"
      - "project.yml"
      - "CoachCore/Sources/**"
      - "CoachCore/Package.swift"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Neutral placeholders: nothing is signed, so no real team or bundle ID is needed.
      BUNDLE_ID_PREFIX: com.example
      APPLE_TEAM_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-unsigned-${{ hashFiles('project.yml', 'CoachCore/Package.swift') }}
          restore-keys: deriveddata-unsigned-
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iPhone app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project RunningCoach.xcodeproj -scheme RunningCoach \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build-iphone.log"
      - name: Build Watch app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project RunningCoach.xcodeproj -scheme RunningCoachWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build-watch.log"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-logs
          path: ${{ runner.temp }}/build-*.log
          retention-days: 3
